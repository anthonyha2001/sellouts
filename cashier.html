<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My page — La Valeur</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1943AF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Valeur">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/cashier.css">
</head>
<body class="cashier-page">
<main class="cp-wrap">
  <div class="login-brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg></div>
    <div><h1>My schedule &amp; cash</h1><p>LV Ajaltoun</p></div>
  </div>

  <!-- Step 1: who + PIN -->
  <form class="card cp-card" id="cpLogin" autocomplete="off" hidden>
    <label for="cpName">Your name</label>
    <select id="cpName"><option value="">Choose…</option></select>
    <label for="cpPin" style="margin-top:14px;">4-digit PIN</label>
    <input type="password" id="cpPin" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" placeholder="••••">
    <p class="login-err" id="cpErr" role="alert"></p>
    <button class="btn" id="cpGo" type="submit">Open</button>
  </form>

  <!-- Step 2: the cashier's own month -->
  <section id="cpView" hidden>
    <div class="cp-head">
      <div><h2 id="cpWho"></h2><p class="muted-note" id="cpMonthLabel"></p></div>
      <button class="btn ghost small" id="cpDone" type="button">Done</button>
    </div>
    <div id="cpSchedule"></div>
    <div id="cpCash">
      <h3 class="cp-sec">My cash differences</h3>
      <div class="filter-row" id="cpMonths"></div>
      <div class="card cp-total" id="cpTotal"></div>
      <div class="card cp-list-card"><table class="cp-list"><tbody id="cpList"></tbody></table></div>
      <p class="muted-note cp-foot">Negative = short, positive = over. Questions? Ask the accountant.</p>
    </div>
  </section>

  <p class="muted-note" id="cpBoot">Loading…</p>
</main>
<script src="js/cashier.js"></script>
</body>
</html>
